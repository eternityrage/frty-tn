name: Auto Publish Videos

on:
  schedule:
   
    - cron: '0 8 * * *'
 
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  publish-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Prevent hanging
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'  # Cache pip dependencies for faster runs
      
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check required secrets
        run: |
          echo "Checking required environment variables..."
          echo ""
          echo "=== CRITICAL SECRETS (Required) ==="
          critical_secrets=(
            "POLLINATIONS_API_KEY"
          )

          critical_missing=0
          for secret in "${critical_secrets[@]}"; do
            if [ -z "${!secret}" ]; then
              echo "❌ Missing: $secret"
              critical_missing=1
            else
              echo "✅ Found: $secret"
            fi
          done

          echo ""
          echo "=== OPTIONAL SECRETS (Will skip if missing) ==="
          optional_secrets=(
            "DROPBOX_APP_KEY"
            "DROPBOX_APP_SECRET"
            "DROPBOX_REFRESH_TOKEN"
            "INSTAGRAM_ACCESS_TOKEN"
            "INSTAGRAM_ACCOUNT_ID"
            "FACEBOOK_ACCESS_TOKEN"
            "FACEBOOK_PAGE_ID"
            "THREADS_ACCESS_TOKEN"
            "THREADS_USER_ID"
            "YT_CLIENT_ID"
            "YT_CLIENT_SECRET"
            "YT_REFRESH_TOKEN"
          )

          for secret in "${optional_secrets[@]}"; do
            if [ -z "${!secret}" ]; then
              echo "⚠️  Optional (not set): $secret"
            else
              echo "✅ Found: $secret"
            fi
          done

          echo ""
          if [ $critical_missing -eq 1 ]; then
            echo "❌ Critical secrets are missing! Pipeline cannot continue."
            exit 1
          fi

          echo "✅ Critical secrets present. Continuing with available platforms..."
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      
      - name: Run automation pipeline
        env:
          # Google Drive
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

          # Instagram
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}

          # Facebook
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Threads
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}

          # YouTube (optional)
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

          # AI Caption
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          AI_MODEL: gemini-fast
        run: |
          echo "Starting automation pipeline..."
          echo "Google Drive Folder: $GOOGLE_DRIVE_FOLDER_ID"
          echo "Service Account Key: ${GOOGLE_SERVICE_ACCOUNT_KEY:0:20}..."
          python auto_pipeline.py
          exit_code=$?

          if [ $exit_code -ne 0 ]; then
            echo "❌ Pipeline failed with exit code $exit_code"
            exit $exit_code
          fi

          echo "✅ Pipeline completed successfully"
      
      - name: Commit published videos log
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Backup current state files generated during this run
          mkdir -p /tmp/state_backup
          [ -f published_videos.json ] && cp published_videos.json /tmp/state_backup/
          [ -f history.json ] && cp history.json /tmp/state_backup/
          [ -f youtube_publish_state.json ] && cp youtube_publish_state.json /tmp/state_backup/
          
          # Pull latest remote changes
          git pull --rebase origin main || git rebase --abort || true
          
          # Merge local backup records with any remote records
          python3 -c "
import json, os

def merge_logs(target_file, backup_file):
    records_map = {}
    for path in (target_file, backup_file):
        if os.path.exists(path):
            try:
                with open(path, 'r', encoding='utf-8') as f:
                    data = json.load(f)
                    if isinstance(data, list):
                        for item in data:
                            vname = item.get('video_name')
                            if vname and vname not in records_map:
                                records_map[vname] = item
            except Exception:
                pass
    merged = list(records_map.values())
    if merged:
        with open(target_file, 'w', encoding='utf-8') as f:
            json.dump(merged, f, indent=4)

merge_logs('published_videos.json', '/tmp/state_backup/published_videos.json')
merge_logs('history.json', '/tmp/state_backup/history.json')

if os.path.exists('/tmp/state_backup/youtube_publish_state.json'):
    import shutil
    shutil.copy('/tmp/state_backup/youtube_publish_state.json', 'youtube_publish_state.json')
"
          
          # Stage and commit
          [ -f published_videos.json ] && git add published_videos.json
          [ -f history.json ] && git add history.json
          [ -f youtube_publish_state.json ] && git add youtube_publish_state.json
          
          if ! git diff --staged --quiet; then
            git commit -m "Update published videos log, history.json & YouTube schedule state [skip ci]"
            git push origin main || (git pull --rebase -X theirs origin main && git push origin main)
            echo "✅ Committed and pushed published_videos.json, history.json and youtube_publish_state.json"
          else
            echo "ℹ️ No changes to commit"
          fi
